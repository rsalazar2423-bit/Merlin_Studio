          description: >-
            Marcas de tiempo de la gestión de llaves
          properties:
            C110: 
              description: >-
                Marca de tiempo en la que el participante recibe solicitud de resolución de la Llave por parte del Ordenante. En formato AAAA-MM-DDThh:mm:ss.SSS
              type: string
            C120: 
              description: >-
                Marca de tiempo en la que el participante envía solicitud de resolución de Llave al Directorio Federado. En formato AAAA-MM-DDThh:mm:ss.SSS
              type: string
            C210: 
              description: >-
                Marca de tiempo en la que el Directorio Federado recibe solicitud de resolución de Llave del Participante. En formato AAAA-MM-DDThh:mm:ss.SSS
              type: string
            C215: 
              description: >-
                Marca de tiempo en la que el Directorio Federado envía solicitud de resolución de Llave al Directorio Centralizado. En formato AAAA-MM-DDThh:mm:ss.SSS
              type: string
            C310: 
              description: >-
                Marca de tiempo en la que el Directorio Centralizado recibe solicitud de resolución de Llave del Directorio Federado. En formato AAAA-MM-DDThh:mm:ss.SSS
              type: string
            C320: 
              description: >-
                Marca de tiempo en la que el Directorio Centralizado envía respuesta sobre resolución de Llave al Directorio Federado. En formato AAAA-MM-DDThh:mm:ss.SSS
              type: string
            C230: 
              description: >-
                Marca de tiempo en la que el Directorio Federado recibe respuesta sobre resolución de Llave del Directorio Centralizado. En formato AAAA-MM-DDThh:mm:ss.SSS
              type: string
            C240: 
              description: >-
                Marca de tiempo en la que el Directorio Federado envía respuesta sobre resolución de Llave al Participante. En formato AAAA-MM-DDThh:mm:ss.SSS
              type: string
            C130: 
              description: >-
                Marca de tiempo en la que elParticipante recibe respuesta sobre resolución de Llave por parte del Directorio de la EASPBVI. En formato AAAA-MM-DDThh:mm:ss.SSS
              type: string
            C140: 
              description: >-
                Marca de tiempo en la que el Participante notifica al Cliente con respuesta sobre solicitud de resolución de Llave. En formato AAAA-MM-DDThh:mm:ss.SSS
              type: string
