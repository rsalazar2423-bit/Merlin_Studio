openapi: 3.0.1
info:
  title: Directory
  description: >- 
    El API de Directory permite administrar las operaciones con las llaves en el directorio Federado de Redeban  (DIFE) como la creación, actualización, cambio de estado entre otras expuestas en la definición realizada por REDEBAN / Arquitectura - Soluciones de Transferencias
    
    
    **Control de cambios**
    
    - 19/02/2025 - Versión inicial
    
    - 24/02/2025 - Se agrega bandera para indicar si la llave está en DICE y campo InstructedAgent en las operaciones GET
    
    - 05/03/2025 - Se actualizan las marcas de tiempo según la comunicación del banco de la república
    
    - 06/03/2025 - Se quita el header RBMURI
    
    - 14/03/2025 - Se corrige obligatoriedad de campos DocumentType y DocumentNumber en metodo PUT y se agrega header X-Forwarded-For en metodo POST - Se soliita Header Accept obligatorio
    
    - 21/03/2025 - Se agrega respuesta 409 en metodos de consulta de llaves
    
    - 27/03/2025 - Se ajusta objeto de marcas de tiempo, se ajustan respuestas 401, 404, 405 y 409 y se elimina respuesta 403
    
    - 01/04/2025 - Se ajusta ejemplo y campos actualizables de metodo PATCH (Actualizar datos de la llave)
    
    - 07/04/2025 - Se ajusta longitud  de la cuenta a 34 digitos
    
    - 28/04/2025 - Se eliminan las marcas de tiempo R105 y R107, se solicita campo AgeAccount obligatorio en foramto AAAA-MM-DD para POST (Directory/key) y PATCH (Directory/keytype)  
    
    - 30/04/2025 - Se agrega el tipo de documento en el get Key By Id
    
    - 09/05/2025 - Se agrega un header a la operación Get Key para indicar si la consulta se está haciendo con la finalidad de originar una transacción
    
    - 12/05/2025 - Se actuliza la descripción del campo Email y address
    
    - 29/05/2025 - se agregan marcas de tiempo en la respuesta del metodo KeepKey
    
    - 18/06/2025 - se complementa campo keyObservation en metodo PUT Directory 

    - 27/06/2025 - se agrega campo InstructedAgent como opcional en el metodo POST /Directory/key
    
    - 02/07/2025 - se agrega ejemplo de campo keyObservation en metodo GET
    
    - 30/07/2025 - Se actualiza respuesta para metodo PUT Directory/keytype a 201
    
    - 08/08/2025 - Se actualiza Ejmplos para metodos PUT y PATCH Directory eliminando AdditionalData 
    
    - 27/08/2025 - Se agrega el SPBVI SRV (Servibanca) en el campo InstructedAgent 
    
    - 04/09/2025 - Se agrega el ejemplo del servicio InstructedAgent en PERSON y COMMERCE
    
    - 12/09/2025 - Se agregan comentarios sobre la restricción de caracteres especiales, No se permitiran (" ' , . ; : \ / <> = ¿? + % # $ | & ! ° ( ) ), en los campos: Nombre y apellido
    
    - 10/10/2025 - Se ajusta longitud minima del campo TownName a 2 caracteres

    - 2026-01-14 - Se agrega opciòn al Schema para el servicio de Directory en el campo InstructedAgent "GOU Payments: GOU"
    
    - 2026-02-06 - Se modifica el campo MobileNumber en los metodos POST/Directory/key y PATCH/Directory/keytype/{keyType}/key/{keyValue}

    - 2026-02-16 - Se elimina el método PUT Directory/KeepKey

    - 2026-02-25 - Se agrega nueva version (3.1) donde se agrega el campo SyncAgent en los metodos POST,PATCH y PUT, el campo InstructedAgent se solicita obligatorio para metodos POST.Directory y PATCH.keytype

    - 2026-04-24 - Se adicionan nuevos servicios para asociación de multillaves en los canales de acceso.

    - 2026-06-26 - Se elimina Header RBM-UserDate de la operación GET preferredKey

    - 2026-07-01 - Se agrega comentario sobre obligatoriedad de MerchantID en metodos POST y PUT para llaves de tipo Comercios

    - 2026-07-10 - Se adiciona nuevo servicio de consulta de llaves, por tipo y número de identificación, permitiendo paginar la información.

    - 2026-09-14 - Se ajusta la especificación para que el campo InstructedAgent sea opcional en los servicios del POST, PATCH KEY y PATCH KEYTYPE.

  version: '3.1'
servers:
  - url: "{protocol}://hostname:<port>/complement/env/api/dir/v3.1.0/"
    variables:
      protocol:
        enum:
          - https
        default: https
externalDocs:
